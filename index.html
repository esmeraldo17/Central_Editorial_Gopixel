<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Editorial — Bangalô × GOPIXEL</title>
<style>
:root{--b:#11377e;--d:#0a275b;--bg:#f5f7fb;--c:#fff;--t:#18202b;--m:#697386;--bd:#e3e8f0;--a:#eaf0ff;--g:#e8f6ef;--y:#fbf3df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Arial,sans-serif}.app{max-width:1300px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}.brand{font-size:12px;color:var(--m);font-weight:bold;letter-spacing:.08em}.title{font-size:30px;font-weight:800;color:var(--d);margin:5px 0}.sub,.muted{color:var(--m)}.badge,.pill,.status{border:1px solid var(--bd);border-radius:999px;padding:6px 10px;font-size:11px;background:#fff}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:20px}.tab,.btn{border:1px solid var(--bd);background:#fff;padding:9px 13px;border-radius:9px;font-weight:700}.tab.active,.btn.soft{background:var(--a);color:var(--d);border-color:transparent}.btn.primary{background:var(--d);color:white;border-color:var(--d)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,.post{background:var(--c);border:1px solid var(--bd);border-radius:15px;padding:17px}.metric{font-size:28px;font-weight:800;color:var(--d);margin-top:4px}h2{margin:0 0 6px}h3{margin:5px 0}.section{margin-top:18px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.post{padding:13px}.pill{display:inline-block;margin:2px}.status{background:var(--a);font-weight:700}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{font-size:11px;color:var(--m);padding:5px}.day{min-height:105px;border:1px solid var(--bd);background:#fff;border-radius:9px;padding:7px}.event{font-size:10px;background:var(--a);border-radius:6px;padding:5px;margin-top:5px;cursor:pointer}.kanban{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:10px;overflow:auto}.col{background:#f0f3f8;border:1px solid var(--bd);border-radius:12px;padding:9px;min-height:190px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:#fff}.form textarea{min-height:90px}.notice{padding:12px;background:var(--y);border-radius:10px;font-size:12px}.success{padding:12px;background:var(--g);border-radius:10px}.modal{position:fixed;inset:0;background:#07142d99;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{background:#fff;max-width:760px;width:100%;max-height:90vh;overflow:auto;border-radius:16px;padding:20px}@media(max-width:800px){.grid4,.grid2{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.calendar{min-width:720px}.app{padding:14px}}@media(max-width:520px){.grid4,.grid2{grid-template-columns:1fr}.title{font-size:24px}}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">GOPIXEL × BANGALÔ ECOHOME</div><div class="title">Central Editorial</div><div class="sub">Planeamento · Produção · Aprovação · Publicação · Aprendizagem</div></div><div class="badge">Fase 01 · 90 dias</div></header>
<nav class="tabs"><button class="tab active" data-v="dashboard">Dashboard</button><button class="tab" data-v="calendar">Calendário</button><button class="tab" data-v="production">Produção</button><button class="tab" data-v="approval">Aprovação Alzira</button><button class="tab" data-v="insights">Insights</button><button class="tab" data-v="new">+ Novo conteúdo</button></nav><main id="main"></main></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY="bangalo_editorial_v1", statuses=["Ideia","Planeado","Briefing","A produzir","Em edição","Em copy","Em aprovação","Aprovado","Agendado","Publicado","Analisado"];
let posts=JSON.parse(localStorage.getItem(KEY)||"null")||[
{id:"BG-001",date:"2026-10-05",format:"Reel",title:"O detalhe que muda a mesa",persona:"Carla",level:"N1",pillar:"Desejo",product:"Individual",status:"Publicado",reach:4200,leads:3,notes:"Testar desejo visual e percepção de valor."},
{id:"BG-002",date:"2026-10-07",format:"Carrossel",title:"3 coisas a observar num bom têxtil",persona:"Carla",level:"N3",pillar:"Educação",product:"Têxteis",status:"Em aprovação",reach:0,leads:0,notes:"Conteúdo educativo."},
{id:"BG-003",date:"2026-10-09",format:"Reel",title:"Personalização não é só colocar um nome",persona:"Marta",level:"N3",pillar:"Educação",product:"Guardanapos",status:"A produzir",reach:0,leads:0,notes:"Testar personalização como argumento de valor."},
{id:"BG-004",date:"2026-10-12",format:"Reel",title:"SET Atemporal WHITE",persona:"Carla",level:"N4",pillar:"Produto",product:"SET WHITE",status:"Planeado",reach:0,leads:0,notes:"Produto + preço + CTA."},
{id:"BG-005",date:"2026-10-15",format:"Carrossel",title:"Por trás da Bangalô",persona:"Carla / Marta",level:"N1",pillar:"Marca",product:"Institucional",status:"Planeado",reach:0,leads:0,notes:"Humanizar a marca através da Alzira."},
{id:"BG-006",date:"2026-10-17",format:"Reel",title:"Está a preparar uma celebração?",persona:"Marta",level:"N5",pillar:"Conversão",product:"Personalizados",status:"Planeado",reach:0,leads:0,notes:"CTA para WhatsApp."}];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(posts));
const pills=p=>`<span class="pill">${esc(p.format)}</span><span class="pill">${esc(p.persona)}</span><span class="pill">${esc(p.level)}</span><span class="pill">${esc(p.pillar)}</span>`;
function card(p){return `<div class="post"><div class="row"><div><div class="muted">${p.id} · ${p.date}</div><h3>${esc(p.title)}</h3></div><span class="status">${esc(p.status)}</span></div><div>${pills(p)}</div><div class="muted" style="margin-top:6px">Produto: <b>${esc(p.product)}</b></div><button class="btn" style="margin-top:9px" onclick="openPost('${p.id}')">Abrir briefing →</button></div>`}
function dash(){let prod=posts.filter(p=>["A produzir","Em edição","Em copy"].includes(p.status)).length,ap=posts.filter(p=>p.status==="Em aprovação").length,pub=posts.filter(p=>p.status==="Publicado").length;return `<div class="grid4"><div class="card"><div class="muted">Conteúdos</div><div class="metric">${posts.length}</div></div><div class="card"><div class="muted">Em produção</div><div class="metric">${prod}</div></div><div class="card"><div class="muted">Aprovação</div><div class="metric">${ap}</div></div><div class="card"><div class="muted">Publicados</div><div class="metric">${pub}</div></div></div><div class="section grid2"><div class="card"><h2>Próximos conteúdos</h2><div class="muted">O que precisa de atenção.</div><div style="display:grid;gap:10px;margin-top:12px">${posts.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(card).join("")}</div></div><div class="card"><h2>Princípio editorial</h2><div class="notice">Cada conteúdo deve ter uma função, uma persona, um nível de consciência, uma hipótese e uma métrica principal.</div><p><b>Leads:</b> ${posts.reduce((a,p)=>a+(+p.leads||0),0)}</p><p><b>Alcance:</b> ${posts.reduce((a,p)=>a+(+p.reach||0),0).toLocaleString("pt-AO")}</p></div></div>`}
function calendar(){let y=2026,m=9,first=new Date(y,m,1),start=(first.getDay()+6)%7,total=new Date(y,m+1,0).getDate(),s=`<div class="card"><div class="row"><div><h2>Outubro 2026</h2><div class="muted">Calendário editorial</div></div><button class="btn primary" onclick="view('new')">+ Novo</button></div><div style="overflow:auto;margin-top:14px"><div class="calendar">`;["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].forEach(x=>s+=`<div class="dow">${x}</div>`);for(let i=0;i<start;i++)s+="<div></div>";for(let d=1;d<=total;d++){let dt=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;s+=`<div class="day"><b>${d}</b>`;posts.filter(p=>p.date===dt).forEach(p=>s+=`<div class="event" onclick="openPost('${p.id}')">${esc(p.format)} · ${esc(p.title)}</div>`);s+="</div>"}return s+"</div></div></div>"}
function production(){return `<div class="card"><h2>Pipeline de produção</h2><div class="muted">Da ideia à publicação.</div><div class="kanban" style="margin-top:14px">${statuses.slice(0,7).map(st=>`<div class="col"><b style="font-size:12px">${st}</b>${posts.filter(p=>p.status===st).map(p=>`<div class="post" style="margin-top:8px;padding:10px" onclick="openPost('${p.id}')"><b style="font-size:12px">${esc(p.title)}</b><div class="muted">${p.date}</div></div>`).join("")||`<div class="muted" style="margin-top:10px">Sem conteúdos</div>`}</div>`).join("")}</div></div>`}
function approval(){let a=posts.filter(p=>p.status==="Em aprovação");return `<div class="card"><h2>Aprovação da Sra. Alzira</h2><div class="muted">Vista simplificada apenas para decisões.</div><div style="display:grid;gap:12px;margin-top:14px">${a.map(p=>`<div class="post"><div class="row"><div><div class="muted">${p.date} · ${p.format}</div><h3>${esc(p.title)}</h3><div class="muted">${esc(p.persona)} · ${esc(p.pillar)}</div></div><span class="status">Aguardando</span></div><div style="margin-top:10px"><button class="btn soft" onclick="approve('${p.id}')">✓ Aprovar</button> <button class="btn" onclick="change('${p.id}')">Pedir alteração</button></div></div>`).join("")||`<div class="success">Não existem conteúdos pendentes.</div>`}</div>`}
function insights(){return `<div class="grid2"><div class="card"><h2>Hipóteses</h2><ul><li>Personalização aumenta mensagens?</li><li>Detalhes aumentam guardados?</li><li>Preço + produto melhora intenção?</li><li>CTA com palavra-chave facilita rastreio?</li></ul></div><div class="card"><h2>Indicadores</h2><p><b>Alcance:</b> ${posts.reduce((a,p)=>a+(+p.reach||0),0).toLocaleString("pt-AO")}</p><p><b>Leads:</b> ${posts.reduce((a,p)=>a+(+p.leads||0),0)}</p></div></div>`}
function novo(){return `<div class="grid2"><div class="card"><h2>Novo conteúdo</h2><div class="form" style="margin-top:12px"><label>ID<input id="n-id" value="BG-${String(posts.length+1).padStart(3,"0")}"></label><label>Data<input id="n-date" type="date" value="2026-10-20"></label><label>Formato<select id="n-format"><option>Reel</option><option>Carrossel</option><option>Story</option><option>Fotografia</option></select></label><label>Título<input id="n-title"></label><label>Persona<input id="n-persona"></label><label>Nível<select id="n-level"><option>N1</option><option>N2</option><option>N3</option><option>N4</option><option>N5</option></select></label><label>Pilar<input id="n-pillar"></label><label>Produto<input id="n-product"></label><label>Hipótese / notas<textarea id="n-notes"></textarea></label><button class="btn primary" onclick="add()">Criar conteúdo</button></div></div><div class="card"><h2>Regras editoriais</h2><div class="notice">Cada conteúdo deve estar ligado a uma persona, nível de consciência, pilar e hipótese.</div></div></div>`}
function openPost(id){let p=posts.find(x=>x.id===id);document.getElementById("modalbox").innerHTML=`<div class="row"><div><div class="muted">${p.id} · ${p.date}</div><h2>${esc(p.title)}</h2></div><button class="btn" onclick="closeM()">Fechar</button></div><div class="grid2" style="margin-top:15px"><div class="form"><label>Estado<select id="e-s">${statuses.map(x=>`<option ${x===p.status?"selected":""}>${x}</option>`).join("")}</select></label><label>Data<input id="e-d" type="date" value="${p.date}"></label><label>Persona<input id="e-p" value="${esc(p.persona)}"></label><label>Nível<input id="e-l" value="${esc(p.level)}"></label><label>Pilar<input id="e-pi" value="${esc(p.pillar)}"></label><label>Produto<input id="e-pr" value="${esc(p.product)}"></label></div><div class="form"><label>Notas / hipótese<textarea id="e-n">${esc(p.notes||"")}</textarea></label><label>Alcance<input id="e-r" type="number" value="${p.reach||0}"></label><label>Leads<input id="e-le" type="number" value="${p.leads||0}"></label><button class="btn primary" onclick="saveP('${p.id}')">Guardar alterações</button><button class="btn" onclick="delP('${p.id}')">Eliminar</button></div></div>`;document.getElementById("modal").classList.add("open")}
function closeM(){document.getElementById("modal").classList.remove("open")}
function saveP(id){let p=posts.find(x=>x.id===id);p.status=e("e-s").value;p.date=e("e-d").value;p.persona=e("e-p").value;p.level=e("e-l").value;p.pillar=e("e-pi").value;p.product=e("e-pr").value;p.notes=e("e-n").value;p.reach=+e("e-r").value;p.leads=+e("e-le").value;save();closeM();render()}
function delP(id){if(confirm("Eliminar este conteúdo?")){posts=posts.filter(p=>p.id!==id);save();closeM();render()}}
function approve(id){let p=posts.find(x=>x.id===id);p.status="Aprovado";save();render()}
function change(id){let p=posts.find(x=>x.id===id);p.status="A produzir";p.notes=(p.notes||"")+" | Alteração solicitada pela cliente.";save();render()}
function add(){posts.push({id:e("n-id").value,date:e("n-date").value,format:e("n-format").value,title:e("n-title").value||"Novo conteúdo",persona:e("n-persona").value||"A definir",level:e("n-level").value,pillar:e("n-pillar").value||"A definir",product:e("n-product").value||"A definir",status:"Ideia",reach:0,leads:0,notes:e("n-notes").value});save();view("calendar")}
function e(id){return document.getElementById(id)}
function view(v){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.v===v));let x={dashboard:dash,calendar,production,approval,insights,new:novo}[v];document.getElementById("main").innerHTML=x()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>view(b.dataset.v));document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeM()};view("dashboard");
</script></body></html>
